<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relationship Discovery Tool</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-100 font-sans selection:bg-teal-200 selection:text-teal-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = window.React;

        // --- DYNAMIC DATA GENERATOR ENGINE ---
        // Fungsi ini mensimulasikan AI yang memproses input user menjadi Framework
        const generateRelationshipData = (inputs) => {
          const { duration, type, personality, sensitive } = inputs;
          
          // 1. Kalkulasi Peta Pemahaman (Radar) berdasarkan durasi
          let radar = { understood: 20, assumption: 40, unknown: 40 };
          if (duration === '<6') radar = { understood: 10, assumption: 35, unknown: 55 };
          if (duration === '6-12') radar = { understood: 25, assumption: 45, unknown: 30 };
          if (duration === '1-3') radar = { understood: 45, assumption: 35, unknown: 20 };
          if (duration === '>3') radar = { understood: 65, assumption: 20, unknown: 15 };

          // 2. Custom AI Coach Message berdasarkan kombinasi kondisi
          let coachMessage = "Kalian sudah mulai saling mengenal. ";
          let recommendedTopic = "family";
          let topicName = "Keluarga & Masa Lalu";

          if (type === 'taaruf') {
            coachMessage = "Dalam proses Taaruf, menyelaraskan fondasi nilai adalah prioritas. Hindari membuang waktu pada asumsi. ";
            recommendedTopic = "religion";
            topicName = "Agama & Nilai Hidup";
          } else if (type === 'ldr') {
            coachMessage = "Jarak (LDR) seringkali memperbesar ruang untuk asumsi. Komunikasi verbal dan manajemen ekspektasi harus dilatih. ";
            recommendedTopic = "conflict";
            topicName = "Manajemen Konflik";
          }

          if (personality === 'introvert') {
            coachMessage += "Mengingat pasanganmu dominan Introvert, gunakan pendekatan perlahan. Jangan memberondong pertanyaan beruntun. Beri dia waktu memproses jawaban. ";
          } else if (personality === 'extrovert') {
            coachMessage += "Pasanganmu Ekstrovert dan mungkin mudah bercerita, tugas utamamu di sini adalah menjadi pendengar aktif dan memilah mana yang fakta vs antusiasme sesaat. ";
          }

          if (sensitive && sensitive.trim() !== "") {
            coachMessage += `Terkait topik sensitif "${sensitive}" yang kamu sebutkan, kita akan 'parkir' dulu topik ini sampai kalian membangun rasa aman (safety) di sesi-sesi awal.`;
          }

          // 3. Modifikasi Konten Pertanyaan Berdasarkan Kondisi (Personalization)
          const baseTopics = [
            { id: 'finance', name: 'Keuangan & Hutang', progress: duration === '>3' ? 60 : 10 },
            { id: 'family', name: 'Keluarga & Masa Lalu', progress: duration === '<6' ? 0 : 30 },
            { id: 'religion', name: 'Agama & Nilai Hidup', progress: type === 'taaruf' ? 10 : 40 },
            { id: 'conflict', name: 'Manajemen Konflik', progress: type === 'ldr' ? 0 : 20 },
            { id: 'career', name: 'Karier & Ambisi', progress: 50 }
          ];

          const questions = {
            family: {
              topic: 'Keluarga & Masa Lalu',
              question: 'Bagaimana hubunganmu dengan orang tuamu sejak kecil hingga sekarang?',
              why: 'Orang dengan unresolved family issue (masalah keluarga yang belum selesai) sering tanpa sadar membawa pola pertahanan diri atau luka tersebut ke dalam pernikahan.',
              followUp: [
                { condition: 'Jika dia bercerita dengan terbuka namun ada rasa sedih/marah', action: 'Tanya: "Bagaimana hal itu membentuk cara kamu melihat peran sebuah keluarga nantinya?"' },
                { condition: 'Jika dia menjawab sangat singkat atau mengalihkan pembicaraan', action: `Karena dia ${personality}, jangan didesak. Tanya perlahan: "Apakah ini topik yang kurang nyaman buatmu saat ini?"` }
              ],
              warning: `Kalau dia terlihat menghindar, jangan langsung menyimpulkan dia menyembunyikan sesuatu yang buruk. Terutama karena dia punya kecenderungan ${personality}, terkadang ini murni karena butuh waktu atau dia belum merasa ruangnya cukup aman.`,
              insight: [
                'Bisa menunjukkan indikasi Secure Attachment (jika berdamai).',
                'Bisa menunjukkan pola Avoidant (jika menolak membahas sama sekali).'
              ]
            },
            conflict: {
              topic: 'Manajemen Konflik',
              question: type === 'ldr' 
                ? 'Karena kita berjauhan, kalau nanti kita ada salah paham besar dan sedang sama-sama emosi, apa yang kamu harapkan aku lakukan?' 
                : 'Kalau kita sedang bertengkar hebat, kamu tipe yang butuh waktu sendiri (cooling down) atau tipe yang harus diselesaikan saat itu juga?',
              why: 'Mencegah siklus toxic "yang satu mengejar, yang satu lari" (pursuer-distancer dynamic) saat konflik terjadi di masa depan.',
              followUp: [
                { condition: 'Jika dia butuh waktu sendiri', action: 'Sepakati batas waktunya: "Oke, tapi boleh kita janji batas maksimal diamnya 1 hari? Supaya aku ngga overthinking."' },
                { condition: 'Jika dia ingin langsung selesai', action: 'Tanya: "Bagaimana kalau salah satu dari kita sedang terlalu emosi untuk berpikir jernih?"' }
              ],
              warning: `Jika gaya konfliknya berbeda denganmu, jangan panik. Perbedaan gaya konflik itu wajar, yang penting adalah ${type === 'ldr' ? 'komitmen untuk tetap terhubung' : 'kompromi cara menyelesaikannya'}.`,
              insight: [
                'Menunjukkan tingkat Regulasi Emosi (Emotional Regulation).',
                'Indikasi apakah dia memiliki pola Conflict Avoidant atau Confrontational.'
              ]
            },
            religion: {
              topic: 'Agama & Nilai Hidup',
              question: 'Apa prinsip hidup atau batasan agama yang sama sekali tidak bisa kamu kompromikan setelah menikah nanti?',
              why: 'Banyak perpisahan terjadi bukan karena tidak cinta, tapi karena benturan core values (nilai dasar) yang baru disadari setelah tinggal serumah.',
              followUp: [
                { condition: 'Jika prinsipnya terlalu kaku bagi Anda', action: 'Jangan langsung berdebat. Gali latar belakangnya: "Boleh cerita pengalaman apa yang membuat prinsip ini sangat penting buatmu?"' },
                { condition: 'Jika dia bilang "aku fleksibel/ngikut aja"', action: 'Beri skenario spesifik. Misal: "Bagaimana kalau menyangkut pendidikan anak kelak?"' }
              ],
              warning: 'Berhati-hatilah dengan asumsi "nanti setelah menikah dia akan berubah". Nilai dasar sangat sulit diubah.',
              insight: [
                'Memetakan Core Values Alignment.',
                'Menunjukkan fleksibilitas vs rigiditas dalam memandang kehidupan.'
              ]
            },
            finance: {
              topic: 'Keuangan & Hutang',
              question: 'Jika nanti setelah menikah kita tiba-tiba menghadapi krisis keuangan, apa hal pertama yang akan kamu potong dari pengeluaran kita?',
              why: 'Pertanyaan ini mengungkap prioritas hidup, gaya hidup dasar yang tak bisa diganggu gugat, dan bagaimana dia memandang "kebutuhan" vs "keinginan".',
              followUp: [
                { condition: 'Jika dia memotong hal-hal tersier (hobi, liburan)', action: 'Validasi pemikirannya dan tanya bagaimana perasaannya jika harus hidup tanpa hal itu untuk waktu yang lama.' },
                { condition: 'Jika dia kebingungan dan tidak mau memotong gaya hidup', action: 'Tanya: "Apakah kamu pernah punya pengalaman harus sangat berhemat sebelumnya?"' }
              ],
              warning: `Kalau dia menghindari pembicaraan uang, jangan langsung cap dia pelit atau menyembunyikan hutang. Karena dia cenderung ${personality}, gunakan pendekatan yang lebih logis dan hindari nada menuduh agar dia merasa aman.`,
              insight: [
                'Menunjukkan tingkat Literasi Keuangan.',
                'Indikasi kecenderungan pola gaya hidup (Frugal vs Extravagant).'
              ]
            },
            career: {
              topic: 'Karier & Ambisi',
              question: 'Di masa depan, jika karier salah satu dari kita mengharuskan pindah kota atau negara, bagaimana kita akan memutuskannya?',
              why: 'Menguji fleksibilitas, ego, dan pandangan tentang kesetaraan gender/peran dalam berumah tangga.',
              followUp: [
                { condition: 'Jika dia bersikeras karier-nya yang utama', action: 'Gali alasannya: "Apakah ini murni karena tuntutan finansial rumah tangga, atau karena ambisi/aktualisasi diri?"' },
                { condition: 'Jika dia meminta kamu yang harus mengalah', action: 'Tanyakan: "Support seperti apa yang akan aku dapatkan jika aku melepaskan pekerjaanku demi ikut kamu?"' }
              ],
              warning: `Jangan terjebak perdebatan teori. Minta dia membayangkan skenario nyata. Mengingat kalian saat ini ${type === 'ldr' ? 'sudah terbiasa LDR, pastikan apakah dia mau terus LDR setelah menikah' : 'satu kota, prospek harus berjauhan bisa jadi isu yang sangat sensitif'}.`,
              insight: [
                'Memperlihatkan fleksibilitas peran (Role Flexibility).',
                'Mengukur seberapa besar ego atau dominasi dalam mengambil keputusan bersama.'
              ]
            }
          };

          return { radar, coachMessage, recommendedTopic, topicName, baseTopics, questions };
        };

        // --- COMPONENTS ---

        const InputForm = ({ onComplete }) => {
          const [formData, setFormData] = useState({
            duration: '',
            type: '',
            personality: '',
            sensitive: ''
          });

          const handleSubmit = (e) => {
            e.preventDefault();
            onComplete(formData);
          };

          return (
            <div className="max-w-2xl mx-auto p-6 bg-white rounded-2xl shadow-xl mt-10 border border-slate-100">
              <div className="text-center mb-8 flex flex-col items-center">
                <div className="bg-teal-50 w-16 h-16 rounded-full flex items-center justify-center mb-4">
                  <i className="ph-fill ph-heart text-teal-600 text-3xl"></i>
                </div>
                <h1 className="text-3xl font-bold text-slate-800 tracking-tight">Conversation Builder</h1>
                <p className="text-slate-500 mt-2 text-sm max-w-md">Bantu AI memahami dinamika kalian untuk merancang <span className="font-semibold text-teal-700">Roadmap Percakapan</span> yang aman dan anti-canggung.</p>
              </div>

              <form onSubmit={handleSubmit} className="space-y-5">
                <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                  <div className="space-y-2">
                    <label className="text-sm font-bold text-slate-700 flex items-center gap-2">
                      <i className="ph-bold ph-hourglass-high text-teal-600"></i> Durasi Pendekatan
                    </label>
                    <select className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:bg-white outline-none transition-all" required
                      onChange={(e) => setFormData({...formData, duration: e.target.value})}>
                      <option value="">Pilih durasi...</option>
                      <option value="<6">Kurang dari 6 bulan</option>
                      <option value="6-12">6 - 12 bulan</option>
                      <option value="1-3">1 - 3 tahun</option>
                      <option value=">3">Lebih dari 3 tahun</option>
                    </select>
                  </div>

                  <div className="space-y-2">
                    <label className="text-sm font-bold text-slate-700 flex items-center gap-2">
                      <i className="ph-bold ph-users-three text-teal-600"></i> Status Hubungan
                    </label>
                    <select className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:bg-white outline-none transition-all" required
                      onChange={(e) => setFormData({...formData, type: e.target.value})}>
                      <option value="">Pilih status...</option>
                      <option value="pacaran">Pacaran 1 Kota</option>
                      <option value="ldr">LDR (Long Distance)</option>
                      <option value="taaruf">Taaruf / Penjajakan Terarah</option>
                    </select>
                  </div>

                  <div className="space-y-2">
                    <label className="text-sm font-bold text-slate-700 flex items-center gap-2">
                      <i className="ph-bold ph-brain text-teal-600"></i> Karakter Pasangan
                    </label>
                    <select className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-teal-500 focus:bg-white outline-none transition-all" required
                      onChange={(e) => setFormData({...formData, personality: e.target.value})}>
                      <option value="">Dominasi kepribadian...</option>
                      <option value="introvert">Introvert (Butuh waktu merespons)</option>
                      <option value="extrovert">Ekstrovert (Mudah dan suka bercerita)</option>
                      <option value="ambivert">Ambivert (Campuran)</option>
                    </select>
                  </div>

                  <div className="space-y-2">
                    <label className="text-sm font-bold text-slate-700 flex items-center gap-2">
                      <i className="ph-bold ph-warning-circle text-rose-500"></i> Topik Sensitif saat ini
                    </label>
                    <input type="text" placeholder="Cth: Mantan, hutang keluarga..." 
                      className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-rose-400 focus:bg-white outline-none transition-all placeholder:text-slate-400"
                      onChange={(e) => setFormData({...formData, sensitive: e.target.value})}
                    />
                  </div>
                </div>

                <button type="submit" className="w-full py-4 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl transition-all transform active:scale-[0.98] mt-6 flex justify-center items-center gap-2 shadow-lg shadow-teal-200">
                  <i className="ph-bold ph-magic-wand text-xl"></i> Generate Roadmap Percakapan
                </button>
              </form>
            </div>
          );
        };

        const Dashboard = ({ onSelectTopic, relationshipData }) => {
          const { radar, coachMessage, recommendedTopic, topicName, baseTopics } = relationshipData;

          return (
            <div className="max-w-4xl mx-auto p-4 md:p-6 mt-4 md:mt-8 space-y-6">
              
              <div className="flex flex-col md:flex-row items-start md:items-center justify-between bg-slate-900 text-white p-6 rounded-2xl shadow-xl overflow-hidden relative">
                <div className="relative z-10">
                  <h2 className="text-2xl font-bold tracking-tight">Relationship Radar</h2>
                  <p className="text-slate-300 text-sm mt-1 max-w-lg leading-relaxed">
                    Kami telah memetakan dinamika hubungan kalian berdasarkan input yang diberikan. Fokuskan percakapan untuk mengurangi area asumsi.
                  </p>
                </div>
                <i className="ph-duotone ph-target text-6xl text-teal-400 opacity-20 absolute -right-2 -bottom-4 md:relative md:opacity-80 md:right-0 md:bottom-0"></i>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                {/* Dynamic Compatibility Radar */}
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow">
                  <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                    <i className="ph-fill ph-chart-polar text-teal-600 text-2xl"></i> Status Pemahaman
                  </h3>
                  <div className="space-y-5">
                    <div>
                      <div className="flex justify-between text-sm mb-1.5">
                        <span className="font-semibold text-slate-700">Area yang sudah dipahami</span>
                        <span className="text-teal-600 font-bold">{radar.understood}%</span>
                      </div>
                      <div className="w-full bg-slate-100 rounded-full h-2.5">
                        <div className="bg-teal-500 h-2.5 rounded-full transition-all duration-1000" style={{ width: `${radar.understood}%` }}></div>
                      </div>
                    </div>
                    <div>
                      <div className="flex justify-between text-sm mb-1.5">
                        <span className="font-semibold text-slate-700">Area yang masih asumsi</span>
                        <span className="text-amber-500 font-bold">{radar.assumption}%</span>
                      </div>
                      <div className="w-full bg-slate-100 rounded-full h-2.5">
                        <div className="bg-amber-400 h-2.5 rounded-full transition-all duration-1000 delay-300" style={{ width: `${radar.assumption}%` }}></div>
                      </div>
                    </div>
                    <div>
                      <div className="flex justify-between text-sm mb-1.5">
                        <span className="font-semibold text-slate-700">Area yang belum dibahas</span>
                        <span className="text-rose-500 font-bold">{radar.unknown}%</span>
                      </div>
                      <div className="w-full bg-slate-100 rounded-full h-2.5">
                        <div className="bg-rose-400 h-2.5 rounded-full transition-all duration-1000 delay-500" style={{ width: `${radar.unknown}%` }}></div>
                      </div>
                    </div>
                  </div>
                  <div className="mt-5 bg-blue-50 p-3 rounded-lg border border-blue-100 flex gap-3 items-start">
                    <i className="ph-fill ph-info text-blue-500 text-lg mt-0.5"></i>
                    <p className="text-xs text-blue-800 font-medium">Bukan soal skor kecocokan, tapi seberapa dalam kalian saling mengenal tanpa menghakimi.</p>
                  </div>
                </div>

                {/* Dynamic Next Best Conversation */}
                <div className="bg-gradient-to-br from-teal-50 to-emerald-50 p-6 rounded-2xl shadow-sm border border-teal-100 flex flex-col justify-between">
                  <div>
                    <div className="flex items-center gap-2 mb-4">
                      <div className="bg-teal-600 text-white p-1.5 rounded-lg shadow-sm">
                        <i className="ph-bold ph-robot text-lg"></i>
                      </div>
                      <span className="text-teal-800 text-sm font-bold uppercase tracking-wider">AI Coach Insight</span>
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">Saran Topik Berikutnya</h3>
                    <p className="text-slate-700 text-sm mb-6 leading-relaxed">
                      {coachMessage} Malam ini, mari mulai masuk ke area <span className="font-bold text-teal-800 bg-teal-100 px-1 rounded">{topicName}</span>.
                    </p>
                  </div>
                  <button 
                    onClick={() => onSelectTopic(recommendedTopic)}
                    className="w-full py-3.5 bg-white border-2 border-teal-600 text-teal-700 font-bold rounded-xl hover:bg-teal-600 hover:text-white transition-all flex justify-center items-center gap-2 group shadow-sm">
                    Lihat Framework Pertanyaan <i className="ph-bold ph-arrow-right text-lg group-hover:translate-x-1 transition-transform"></i>
                  </button>
                </div>

              </div>

              {/* Conversation Coverage */}
              <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2">
                  <i className="ph-fill ph-list-checks text-teal-600 text-2xl"></i> Conversation Coverage Score
                </h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-x-6 gap-y-4">
                  {baseTopics.map(topic => (
                    <div key={topic.id} className="group cursor-pointer p-3 bg-slate-50 hover:bg-teal-50 rounded-xl transition-colors border border-slate-100 hover:border-teal-200"
                         onClick={() => onSelectTopic(topic.id)}>
                      <div className="flex justify-between items-center mb-2">
                        <span className="font-semibold text-slate-700 text-sm flex items-center gap-1.5">
                          {topic.progress >= 50 ? <i className="ph-bold ph-check-circle text-teal-500"></i> : <i className="ph-light ph-circle text-slate-300"></i>}
                          {topic.name}
                        </span>
                        <span className="text-xs font-bold text-slate-500">{topic.progress}%</span>
                      </div>
                      <div className="w-full bg-slate-200 rounded-full h-1.5">
                        <div className={`h-1.5 rounded-full ${topic.progress === 0 ? 'bg-slate-300' : topic.progress >= 50 ? 'bg-teal-500' : 'bg-amber-400'}`} 
                             style={{ width: `${topic.progress}%` }}></div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

            </div>
          );
        };

        const TopicDetail = ({ topicId, onBack, relationshipData }) => {
          const { questions } = relationshipData;
          // Mengambil data sesuai topik yang di-klik
          const data = questions[topicId];

          // Jika topik tidak ditemukan
          if (!data) {
             return (
               <div className="max-w-3xl mx-auto p-6 md:p-10 mt-10 text-center bg-white rounded-3xl shadow-xl border border-slate-100">
                 <i className="ph-duotone ph-cone text-6xl text-amber-500 mb-4"></i>
                 <h2 className="text-2xl font-bold text-slate-800">Topik Sedang Disusun</h2>
                 <p className="text-slate-500 mt-2 mb-8 max-w-md mx-auto">AI Coach sedang menganalisis literatur psikologi untuk membuat framework pada topik ini. Silakan pilih topik lain.</p>
                 <button onClick={onBack} className="px-6 py-3 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl transition-all shadow-md">
                    Kembali ke Dashboard
                 </button>
               </div>
             );
          }

          return (
            <div className="max-w-3xl mx-auto p-4 md:p-6 mt-2 md:mt-4">
              <button onClick={onBack} className="flex items-center gap-2 text-slate-500 hover:text-slate-800 transition-colors mb-6 font-semibold bg-white px-4 py-2 rounded-full shadow-sm border border-slate-200 w-max">
                <i className="ph-bold ph-arrow-left text-lg"></i> Kembali ke Dashboard
              </button>

              <div className="bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
                {/* Header Section */}
                <div className="bg-teal-800 p-8 text-white relative overflow-hidden">
                  <div className="absolute -right-8 -top-8 opacity-10 rotate-12">
                     <i className="ph-fill ph-quotes text-9xl"></i>
                  </div>
                  <div className="relative z-10">
                    <span className="bg-teal-900/50 border border-teal-700/50 px-3 py-1.5 rounded-lg text-xs font-bold uppercase tracking-wider mb-4 inline-block">
                      Topik: {data.topic}
                    </span>
                    <h2 className="text-2xl md:text-3xl font-bold leading-tight mt-2 drop-shadow-md">"{data.question}"</h2>
                  </div>
                </div>

                <div className="p-6 md:p-8 space-y-8 bg-slate-50/50">
                  
                  {/* Why it's important */}
                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden">
                    <div className="absolute left-0 top-0 bottom-0 w-1.5 bg-blue-500"></div>
                    <h3 className="font-bold text-slate-800 flex items-center gap-2 mb-2 text-lg">
                      <i className="ph-fill ph-lightbulb text-blue-500 text-xl"></i> Kenapa ini penting?
                    </h3>
                    <p className="text-slate-600 leading-relaxed text-sm">{data.why}</p>
                  </div>

                  {/* How to Follow Up */}
                  <div>
                    <h3 className="font-bold text-slate-800 flex items-center gap-2 mb-4 text-lg">
                      <i className="ph-fill ph-chats-teardrop text-emerald-600 text-xl"></i> Skenario Follow Up
                    </h3>
                    <div className="space-y-4">
                      {data.followUp.map((item, idx) => (
                        <div key={idx} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col md:flex-row gap-4 md:items-stretch">
                          <div className="flex-1">
                            <div className="text-[10px] font-bold text-slate-400 mb-1 uppercase tracking-wider">Jika dia menjawab:</div>
                            <div className="text-slate-700 font-medium text-sm">{item.condition}</div>
                          </div>
                          <div className="hidden md:flex items-center text-slate-300">
                             <i className="ph-bold ph-arrow-right text-xl"></i>
                          </div>
                          <div className="flex-1 bg-emerald-50/50 p-4 rounded-xl border border-emerald-100">
                            <div className="text-[10px] font-bold text-emerald-600 mb-1 uppercase tracking-wider">Lanjutkan dengan:</div>
                            <div className="text-teal-900 font-semibold text-sm">
                              {item.action}
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                    {/* Warning */}
                    <div className="bg-rose-50 p-5 rounded-2xl border border-rose-100 shadow-sm">
                      <h3 className="font-bold text-rose-800 flex items-center gap-2 mb-3">
                        <i className="ph-fill ph-warning-circle text-rose-500 text-xl"></i> Red Flag / Warning
                      </h3>
                      <p className="text-rose-700/90 text-sm leading-relaxed">{data.warning}</p>
                    </div>

                    {/* Insights */}
                    <div className="bg-amber-50 p-5 rounded-2xl border border-amber-100 shadow-sm">
                      <h3 className="font-bold text-amber-900 flex items-center gap-2 mb-3">
                        <i className="ph-fill ph-brain text-amber-500 text-xl"></i> Insight Perilaku
                      </h3>
                      <ul className="space-y-3">
                        {data.insight.map((point, idx) => (
                          <li key={idx} className="flex items-start gap-2.5 text-sm">
                            <i className="ph-fill ph-check-circle text-amber-500 text-base mt-0.5 flex-shrink-0"></i>
                            <span className="text-amber-900/80 font-medium">{point}</span>
                          </li>
                        ))}
                      </ul>
                      <p className="text-[10px] text-amber-600/70 mt-4 border-t border-amber-200 pt-2 font-medium">*Bukan diagnosis klinis, gunakan sebagai observasi.</p>
                    </div>
                  </div>

                </div>
                
                {/* Action Footer */}
                <div className="p-6 bg-white border-t border-slate-100 flex flex-col sm:flex-row gap-3">
                  <button onClick={onBack} className="flex-1 py-3.5 bg-slate-50 hover:bg-slate-100 text-slate-600 font-bold rounded-xl transition-colors border border-slate-200">
                    Bahas Nanti Saja
                  </button>
                  <button onClick={onBack} className="flex-1 py-3.5 bg-teal-600 hover:bg-teal-700 text-white font-bold rounded-xl transition-colors flex justify-center items-center gap-2 shadow-md shadow-teal-100">
                    <i className="ph-bold ph-check-fat"></i> Tandai Sudah Dibahas
                  </button>
                </div>
              </div>
            </div>
          );
        };

        const App = () => {
          const [view, setView] = useState('input'); 
          const [activeTopic, setActiveTopic] = useState(null);
          const [formData, setFormData] = useState(null);
          
          // Generate data dinamis berdasarkan formData
          const relationshipData = useMemo(() => {
            if (!formData) return null;
            return generateRelationshipData(formData);
          }, [formData]);

          const handleFormComplete = (data) => {
            setFormData(data);
            setView('loading');
            setTimeout(() => {
              setView('dashboard');
            }, 2000);
          };

          const handleSelectTopic = (topicId) => {
            setActiveTopic(topicId);
            setView('topic');
          };

          return (
            <div className="min-h-screen pb-12 flex flex-col font-sans">
              <nav className="bg-white/80 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
                <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                  <div className="flex items-center gap-2 font-bold text-xl tracking-tight text-slate-800 cursor-pointer" onClick={() => setView('input')}>
                    <div className="bg-teal-600 text-white p-1.5 rounded-lg flex items-center justify-center">
                      <i className="ph-fill ph-heart text-xl"></i>
                    </div>
                    RelTool.
                  </div>
                  {view !== 'input' && view !== 'loading' && (
                    <div className="text-xs font-bold text-teal-700 bg-teal-50 px-3 py-1.5 rounded-full flex items-center gap-1.5 border border-teal-100">
                      <i className="ph-bold ph-check-circle"></i> Sesi Disesuaikan (AI)
                    </div>
                  )}
                </div>
              </nav>

              <main className="flex-1 px-4 sm:px-0">
                {view === 'input' && <InputForm onComplete={handleFormComplete} />}
                
                {view === 'loading' && (
                  <div className="flex flex-col items-center justify-center min-h-[70vh] px-4 animate-pulse">
                    <i className="ph-duotone ph-magic-wand text-teal-600 text-6xl mb-6"></i>
                    <h2 className="text-2xl font-bold text-slate-800 text-center">Menyusun Framework Personal...</h2>
                    <p className="text-slate-500 mt-3 text-center max-w-md leading-relaxed text-sm">
                      Menganalisis durasi hubungan, karakter {formData?.personality}, dan model {formData?.type} kalian untuk memetakan titik buta (blind spots).
                    </p>
                  </div>
                )}

                {view === 'dashboard' && relationshipData && (
                  <Dashboard onSelectTopic={handleSelectTopic} relationshipData={relationshipData} />
                )}

                {view === 'topic' && relationshipData && (
                  <TopicDetail topicId={activeTopic} onBack={() => setView('dashboard')} relationshipData={relationshipData} />
                )}
              </main>
            </div>
          );
        };

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
